<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Battleship</title>
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="icon" href="data:,">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Battleship</h1>
      <p id="status"></p>
      <section id="game">
        <div id="placement-controls">
          <ul id="ship-queue"></ul>
          <button type="button" id="button-rotate">Rotate</button>
          <button type="button" id="button-auto">Auto Place</button>
          <button type="button" disabled id="button-start">Start Game</button>
        </div>
        <h2>Your Fleet</h2>
        <div id="player-board"></div>
        <h2>Enemy Waters</h2>
        <div id="enemy-board"></div>
        <div id="gameover" hidden>
          <p id="winner"></p>
          <button type="button" id="button-restart">Restart</button>
        </div>
      </section>
    </main>
    <noscript>Error: JavaScript required</noscript>
  </body>
</html>
