<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Battleship</title>
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="icon" href="data:,">
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Battleship</h1>
      <p id="status"></p>
      <section id="menu">
        <form id="menu-form">
          <label id="label-name" for="player-name">Your name</label>
          <input
            id="player-name"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="Player 1"
            autofocus
          >
          <button type="submit">Enter</button>
        </form>
      </section>
      <section id="game" data-phase="menu">
        <div id="ship-panel">
          <h3>Ships</h3>
          <ul id="ship-queue"></ul>
        </div>
        <div id="panel-controls">
          <div id="button-actions">
            <button type="button" id="button-undo" disabled>Undo</button>
            <button type="button" id="button-rotate">Rotate</button>
            <button type="button" id="button-auto">Auto Place</button>
            <button type="button" id="button-start" disabled>Start Game</button>
          </div>
          <button type="button" id="button-toggle-board" hidden>Board</button>
          <button type="button" id="button-restart">
            Restart Game
          </button>
        </div>
        <h2>Your Fleet</h2>
        <div id="player-board"></div>
        <h2>Enemy Waters</h2>
        <div id="enemy-board"></div>
        <div id="gameover" hidden>
          <p id="winner"></p>
        </div>
      </section>
    </main>
  </body>
</html>
