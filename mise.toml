[tools]
"node" = "lts"
"biome" = "2"
"dprint" = "0"

[tasks.setup]
description = "Install tools & dependencies"
run = "mise install && npm install"

[tasks.dev]
description = "Start Vite dev server"
run = "npm run dev"

[tasks.build]
description = "Build production site"
run = "npm run build"

[tasks.preview]
description = "Preview the built site"
run = "npm run preview"

[tasks.fmt]
description = "Auto-format source files"
run = "biome check --write . && dprint fmt"

[tasks.fmt-check]
description = "Check formatting only"
run = "biome ci . && dprint check"

[tasks.lint]
description = "Lint source files"
run = "biome lint ."

[tasks.test]
description = "Run Vitest tests"
run = "npm run test"

[tasks.test-watch]
description = "Run Vitest in watch mode"
run = "npm run test:watch"

[tasks.ci]
description = "Run all CI checks"
depends = ["fmt-check", "lint", "test"]
